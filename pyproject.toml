[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "r4r"
version = "0.1.0"
description = "RAG-for-Robotics + GraphNet: GraphRAG over a dynamic 3D scene graph with GNN scoring and validated LLM planning"
requires-python = ">=3.8"
dependencies = [
    "networkx>=3.1",
    "numpy>=1.24",
    "scipy>=1.10",
    "pydantic>=2.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
sim = ["mujoco>=3.2"]
planner = ["ollama>=0.6"]

[tool.setuptools.packages.find]
include = ["r4r*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
